<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Product Demos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Hero Section -->
  <section class="bg-primary text-white text-center p-5">
    <div class="container">
      <h1>Welcome to Our App Showcase</h1>
      <p class="lead">Explore our product demos and connect with us directly on WhatsApp!</p>
    </div>
  </section>

  <!-- App Demo Links -->
  <section class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">Our App Demos</h2>
      <ul class="list-group">
        <li class="list-group-item"><strong>Billing App:</strong> <a href="https://example.com/billing" target="_blank">View Demo</a></li>
        <li class="list-group-item"><strong>School Management App:</strong> <a href="https://example.com/school" target="_blank">View Demo</a></li>
        <li class="list-group-item"><strong>CRM App:</strong> <a href="https://example.com/crm" target="_blank">View Demo</a></li>
        <!-- Add more apps as needed -->
      </ul>
    </div>
  </section>

  <!-- Contact Form -->
  <section class="py-5 bg-light">
    <div class="container">
      <h2 class="text-center mb-4">Contact Us</h2>
      <form id="contactForm">
        <div class="mb-3">
          <label for="name" class="form-label">Your Name</label>
          <input type="text" id="name" class="form-control" required/>
        </div>
        <div class="mb-3">
          <label for="number" class="form-label">Phone Number</label>
          <input type="tel" id="number" class="form-control" required/>
        </div>
        <div class="mb-3">
          <label for="requirement" class="form-label">Your Requirement</label>
          <textarea id="requirement" class="form-control" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send via WhatsApp</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2025 Your Company Name. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const number = document.getElementById("number").value.trim();
      const requirement = document.getElementById("requirement").value.trim();

      const message = `Name: ${name}%0APhone: ${number}%0ARequirement: ${requirement}`;
      window.open(`https://wa.me/7010310607?text=${message}`, '_blank');
    });
  </script>

</body>
</html>
